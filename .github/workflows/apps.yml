# Gera os instaladores e as versões portáteis para Windows, macOS e Linux
# e publica tudo numa Release do GitHub. Os botões "Baixar o app" do site apontam para ela.
#
# Duas formas de lançar uma versão:
#   - Actions → "Gerar apps" → "Run workflow" e digite a versão (ex.: v1.0.1)
#   - ou crie uma tag: git tag v1.0.1 && git push origin v1.0.1
name: Gerar apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar (ex.: v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # Cria a Release primeiro; cada sistema envia seus arquivos assim que fica pronto,
  # sem esperar os outros (as máquinas Mac do GitHub costumam demorar mais).
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.versao || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Converta ${{ steps.tag.outputs.tag }}
          make_latest: true
          body: |
            ## Baixar

            | Sistema | Instalar | Sem instalar (extrair e abrir) |
            |---|---|---|
            | Windows | `Converta-Setup.exe` | `Converta-windows.zip` → pasta `Converta` → `Converta.exe` |
            | macOS | `Converta-mac.dmg` | `Converta-mac.zip` → `Converta.app` |
            | Linux | `Converta-linux.AppImage` | `Converta-linux.tar.gz` → `converta` |

            **Primeira vez no Windows:** se aparecer "O Windows protegeu o computador", clique em
            **Mais informações → Executar assim mesmo**.

            **Primeira vez no Mac:** se aparecer um aviso, abra **Ajustes do Sistema → Privacidade e Segurança**
            e clique em **Abrir Mesmo Assim**.

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
      - run: npx electron-builder --publish never
        env:
          # Sem certificado de assinatura: o Mac recebe assinatura "ad-hoc".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Versão portátil do Windows (.zip)
        if: runner.os == 'Windows'
        run: node scripts/portable-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: converta-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
      - name: Anexar à Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
